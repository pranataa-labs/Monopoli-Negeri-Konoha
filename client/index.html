<!doctype html>
<html lang="id" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Monopoli Negeri Konoha — Vibrant Neo-Brutalist Pop</title>
    <meta name="description" content="Digital Board Game Satir Ekonomi Politik Indonesia Berbasis Vibrant Neo-Brutalist Pop Art Style." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      (function() {
        try {
          localStorage.setItem('konoha_theme', 'light');
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#E0F2FE] text-[#0F172A] antialiased selection:bg-[#FF6B6B] selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
